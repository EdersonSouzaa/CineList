<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CineList - O seu catálogo de filmes pessoal. Avalie com notas e comentários, favorite e organize a sua própria biblioteca de filmes." />
    
    <!-- PWA Meta Tags e Links -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffb800" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <title>CineList - Catálogo e Biblioteca Pessoal de Filmes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Script de PWA e Service Worker -->
    <script>
      // Captura o prompt de instalação para o React
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        // Avisar o React que o app pode ser instalado
        window.dispatchEvent(new CustomEvent('pwa-installable'));
      });

      window.addEventListener('appinstalled', () => {
        window.deferredPrompt = null;
        console.log('CineList instalado com sucesso!');
      });

      // Evitar cache/Service Worker em localhost durante o desenvolvimento
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) {
              registration.unregister();
              console.log('Service Worker removido em localhost');
            }
          });
        }
      } else {
        // Registra o Service Worker em produção
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => {
                console.log('Service Worker registrado:', reg.scope);
                reg.update();
              })
              .catch(err => console.log('Falha ao registrar Service Worker:', err));
          });
        }
      }
    </script>
  </body>
</html>
